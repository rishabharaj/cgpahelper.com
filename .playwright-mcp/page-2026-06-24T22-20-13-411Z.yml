                - text: or
                - link "cgpa calculator nu" [ref=e328] [cursor=pointer]:
                  - /url: /universities/nu-cgpa-calculator
                - text: to calculate college exam grades.
              - paragraph [ref=e329]: "Similarly, private universities in Dhaka use unique grading frameworks to assess performance:"
